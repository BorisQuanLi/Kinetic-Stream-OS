services:
  # The "Site Database" (Simulating the 12TB/day edge node)
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: kinetic-db
    user: root
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrongPassword123
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrongPassword123", "-Q", "SELECT 1", "-C"]
      interval: 10s
      timeout: 3s
      retries: 10

  # The "Orchestrator" (Simulating the Deployment Controller)
  jenkins:
    image: jenkins/jenkins:lts
    container_name: kinetic-jenkins
    privileged: true
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  jenkins_home:
